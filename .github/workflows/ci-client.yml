name: Client CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/openapi/backend.json"
      - ".github/workflows/ci-client.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  lint_and_build:
    name: Prettier, ESLint, Vitest, TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install pnpm
        # Held at v4: the enterprise action allowlist does not admit v5, and a
        # blocked action fails the workflow before any step runs. The Node 20
        # deprecation warning it emits is the lesser cost.
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.3"
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Unit and component regressions
        run: pnpm test

      - name: TypeScript
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  build_image:
    name: Build frontend image
    runs-on: ubuntu-latest
    # Override the workflow-level `working-directory: frontend`: this job's first
    # `run:` step (Free disk space) executes before checkout, when `frontend/`
    # does not exist yet. `uses:` actions ignore this anyway, so the
    # build-push-action `context: ./frontend` still resolves from the repo root.
    defaults:
      run:
        working-directory: .
    # The `secrets` context is not allowed in `if:` expressions, so surface the
    # NGC key as an env var and gate the nvcr.io login on that instead.
    env:
      NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to nvcr.io (for base image)
        if: ${{ env.NGC_API_KEY != '' }}
        uses: docker/login-action@v4
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ env.NGC_API_KEY }}

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          build-args: |
            PYTHON_API_URL=http://auto-ontology:3001
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false

  browser_regressions:
    name: Authenticated browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: auto_ontology
          POSTGRES_PASSWORD: fixture_ci_only
          POSTGRES_DB: auto_ontology
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auto_ontology -d auto_ontology"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: auto_ontology
      POSTGRES_PASSWORD: fixture_ci_only
      POSTGRES_DATABASE: auto_ontology
      APP_URL: http://127.0.0.1:3000
      PYTHON_API_URL: http://127.0.0.1:3001
      AUTH_SECRET: isolated-ci-auth-secret-at-least-thirty-two-characters
      AUTO_ONTOLOGY_ADMIN_EMAIL: fixture-admin@example.test
      AUTO_ONTOLOGY_ADMIN_PASSWORD: isolated-ci-admin-password
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.3"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --project ..
          pnpm exec playwright install --with-deps chromium
      - name: Prepare isolated schemas
        run: |
          cd ..
          uv run --no-sync alembic upgrade head
          cd frontend
          pnpm db:push
      - name: Build without external font downloads
        run: pnpm build
      - name: Start application services
        run: |
          cd ..
          uv run --no-sync uvicorn auto_ontology.server.__main__:create_app --factory --host 127.0.0.1 --port 3001 > /tmp/ontology-backend.log 2>&1 &
          cd frontend
          pnpm exec next start --hostname 127.0.0.1 --port 3000 > /tmp/ontology-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser checks (no skip or retry)
        run: pnpm exec playwright test
      - name: Upload browser measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: frontend/test-results/
          retention-days: 7
